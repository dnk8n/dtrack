services:
  postgres:
    build:
      context: ./config/dockerfiles/postgres
      dockerfile: ./Dockerfile
      # The Dockerfile's last stage adds test tooling; production must be
      # selected explicitly (the dev override switches to the test stage).
      target: production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      net: {}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # One-shot database tasks (dtrack/ops/dtrack-ops), built from this
  # checkout: `docker compose run --rm --build ops <command>`. initdb.sh and
  # power-user.sh call it; servers run the published image the same way. The
  # profile keeps it out of `docker compose up`.
  ops:
    build:
      context: ./config/dockerfiles/postgres
      dockerfile: ./Dockerfile
      target: ops
      additional_contexts:
        db: ./dtrack/db
        ops: ./dtrack/ops
    image: dtrack-ops:local
    profiles: [tools]
    depends_on:
      - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD_APP: ${POSTGRES_PASSWORD_APP}
      POSTGRES_PASSWORD_APP_ADMIN: ${POSTGRES_PASSWORD_APP_ADMIN}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
    networks:
      net: {}
    volumes:
      # Local backups and restores: ./backup (gitignored) by default.
      - ${OPS_BACKUP_DIR:-./backup}:/backups

  postgrest:
    depends_on:
      - postgres
    environment:
      # https://postgrest.org/en/stable/configuration.html
      PGRST_APP_SETTINGS_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      PGRST_APP_SETTINGS_AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE}
      PGRST_DB_PRE_REQUEST: pre.request
      PGRST_DB_SCHEMA: api
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD_APP}@postgres:5432/dtrack
      PGRST_JWT_ROLE_CLAIM_KEY: ${PGRST_JWT_ROLE_CLAIM_KEY}
      PGRST_JWT_SECRET: "@/config/jwt-secret"
      PGRST_OPENAPI_MODE: ignore-privileges
      PGRST_OPENAPI_SECURITY_ACTIVE: "true"
    image: postgrest/postgrest:v14.15
    networks:
      net: {}
    restart: unless-stopped
    volumes:
      - ./keys/jwt-secret:/config/jwt-secret:rw

  react-admin:
    build:
      context: ./dtrack/ui
      dockerfile: ../../config/dockerfiles/react-admin/Dockerfile
      args:
        VITE_MSAL_CLIENT_ID: ${AZURE_CLIENT_ID}
        VITE_MSAL_AUTHORITY: https://login.microsoftonline.com/${AZURE_TENANT_ID}
        VITE_PALETTE_PRIMARY: ${PALETTE_PRIMARY}
        VITE_PALETTE_SECONDARY: ${PALETTE_SECONDARY}
    networks:
      net: {}
    restart: unless-stopped

  swagger:
    depends_on:
      - postgrest
    image: swaggerapi/swagger-ui:v5.32.8
    networks:
      net: {}
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  net:

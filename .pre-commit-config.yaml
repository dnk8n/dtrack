repos:
  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: "https://github.com/shellcheck-py/shellcheck-py"
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # Follow sourced files (tests/lib.sh) relative to the script.
        args: ["--external-sources", "--source-path=SCRIPTDIR"]
        # The db bootstrap fragments are application code (executed through
        # envsubst with a different variable model) — out of scope for now.
        exclude: ^dtrack/db/sql/
  - repo: "https://github.com/antonbabenko/pre-commit-terraform"
    rev: v1.83.4
    hooks:
      - id: terraform_validate
      - id: terraform_fmt
  - repo: "https://github.com/rhysd/actionlint"
    rev: v1.7.12
    hooks:
      # Also runs shellcheck on `run:` scripts when shellcheck is on PATH
      # (it is on GitHub's ubuntu runners).
      - id: actionlint

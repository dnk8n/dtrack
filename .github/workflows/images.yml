# Build the deployable images and publish them to GitHub Container Registry,
# so servers pull them instead of building (docs/deployment.md, single-server
# deploy). The images hold no secrets and no deployment settings: the UI reads
# its tenant, client and host from the container environment at start
# (RUNTIME_CONFIG=true), and Postgres gets everything from compose.
#
# Tags: sha-<short sha> on every published build (what servers pin), the
# branch name, semver for v* tags, and latest on the default branch.
# Pull requests build both images without publishing, to catch breakage.
name: images

on:
  push:
    branches: [main, consolidation]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dtrack-postgres
            context: ./config/dockerfiles/postgres
            dockerfile: ./config/dockerfiles/postgres/Dockerfile
            target: production
            build-args: ""
          - image: dtrack-ui
            context: ./dtrack/ui
            dockerfile: ./config/dockerfiles/react-admin/Dockerfile
            target: ""
            build-args: RUNTIME_CONFIG=true
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

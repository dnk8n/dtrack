name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: dtrack/ui/yarn.lock

      - name: Install UI dependencies
        working-directory: dtrack/ui
        run: yarn install --frozen-lockfile

      - name: Type-check UI
        working-directory: dtrack/ui
        run: yarn type-check

      - name: Lint UI (eslint, no fixes)
        working-directory: dtrack/ui
        run: npx eslint ./src --ext .jsx,.js,.ts,.tsx --quiet --ignore-path ./.gitignore

      - name: Check UI formatting (prettier, no fixes)
        working-directory: dtrack/ui
        run: npx prettier --check "./**/*.{js,jsx,ts,tsx,css,md,json}"

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

      - name: Check test case ids are documented
        run: ./tests/check-test-case-ids.sh

  stack-tests:
    # Each runner recreates the isolated test environment (own compose
    # project, cluster and ports) from the ground up; the dev stack is not
    # needed at all in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Create environment files from templates
        run: make env

      - name: Database tests (pgTAP)
        run: ./tests/run-db-tests.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: API tests (vitest against PostgREST)
        run: ./tests/run-api-tests.sh

      - name: End-to-end tests (Playwright against the UI)
        run: ./tests/run-e2e-tests.sh

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 7

      - name: Dump test environment logs
        if: failure()
        run: |
          COMPOSE_PROJECT_NAME=dtrack-test \
          COMPOSE_FILE=docker-compose.yaml:config/docker-compose.overrides/dev.yaml:config/docker-compose.overrides/debug.yaml:config/docker-compose.overrides/test.yaml \
          docker compose logs --no-color > compose-logs.txt

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

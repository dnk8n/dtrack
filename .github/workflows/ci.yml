name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: dtrack/ui/yarn.lock

      - name: Install UI dependencies
        working-directory: dtrack/ui
        run: yarn install --frozen-lockfile

      - name: Type-check UI
        working-directory: dtrack/ui
        run: yarn type-check

      - name: Lint UI (eslint, no fixes)
        working-directory: dtrack/ui
        run: npx eslint ./src --ext .jsx,.js,.ts,.tsx --quiet --ignore-path ./.gitignore

      - name: Check UI formatting (prettier, no fixes)
        working-directory: dtrack/ui
        run: npx prettier --check "./**/*.{js,jsx,ts,tsx,css,md,json}"

      # The terraform_validate/terraform_fmt hooks need the CLI, which
      # the runner image does not ship.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      # The same steps as pre-commit/action@v3.0.1, whose latest release still
      # pins actions/cache@v4 (a deprecated Node 20 action).
      - name: Install pre-commit
        run: python -m pip install pre-commit

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Check test case ids are documented
        run: ./tests/check-test-case-ids.sh

  stack-tests:
    # Each runner recreates the isolated test environment (own compose
    # project, cluster and ports) from the ground up; the dev stack is not
    # needed at all in CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Create environment files from templates
        run: make env

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Run all test suites in parallel (isolated environments)
        run: ./tests/run-all.sh

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            tests/logs/
            tests/playwright-report/
            tests/test-results/
          retention-days: 7

      - name: Dump test environment container logs
        if: failure()
        run: |
          for suite in db api e2e; do
            COMPOSE_PROJECT_NAME=dtrack-test-$suite \
            COMPOSE_FILE=docker-compose.yaml:config/docker-compose.overrides/dev.yaml:config/docker-compose.overrides/debug.yaml:config/docker-compose.overrides/test.yaml \
            docker compose logs --no-color > compose-logs-$suite.txt || true
          done

      - name: Upload test environment container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs-*.txt
          retention-days: 7
